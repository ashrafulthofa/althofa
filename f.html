    /*

    const titles = {

        bfs: "BFS - Breadth First Search",

        dfs: "DFS - Depth First Search",

        bubble: "Bubble Sort",

        insertion: "Insertion Sort"

    };


    /*
    ============================================================
    SHOW CODE
    ============================================================
    */

    function showCode(id, button) {

        // Display code
        document.getElementById("code-display").textContent =
            codes[id];

        // Change title
        document.getElementById("code-title").textContent =
            titles[id];


        // Remove active from all buttons

        const buttons =
            document.querySelectorAll(".nav-btn");

        buttons.forEach(btn => {

            btn.classList.remove("active");

        });


        // Activate clicked button

        button.classList.add("active");


        // Reset copy button

        document.getElementById("copy-button").textContent =
            "Copy Code";
    }


    /*
    ============================================================
    COPY EXACT CODE
    ============================================================
    */

    function copyCode() {

        const activeButton =
            document.querySelector(".nav-btn.active");


        let id;


        if (activeButton.textContent.trim() === "BFS") {

            id = "bfs";

        } else if (activeButton.textContent.trim() === "DFS") {

            id = "dfs";

        } else if (
            activeButton.textContent.trim() === "BUBBLE SORT"
        ) {

            id = "bubble";

        } else {

            id = "insertion";

        }


        /*
        Copy the ORIGINAL C++ code,
        NOT the displayed HTML.
        */

        navigator.clipboard.writeText(codes[id])
            .then(() => {

                const button =
                    document.getElementById("copy-button");

                button.textContent = "Copied!";


                setTimeout(() => {

                    button.textContent = "Copy Code";

                }, 1500);

            })

            .catch(() => {

                alert("Unable to copy code.");

            });
    }


    /*
    ============================================================
    LOAD BFS BY DEFAULT
    ============================================================
    */

    document.getElementById("code-display").textContent =
        codes.bfs;

</script>
