<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algorithm Codes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 100;

            background: #222;

            padding: 15px;

            display: flex;
            justify-content: center;
            gap: 10px;
        }

        nav button {
            border: none;

            background: #444;
            color: white;

            padding: 12px 25px;

            border-radius: 6px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        nav button:hover {
            background: #666;
        }

        nav button:active {
            transform: scale(0.95);
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1000px;

            margin: 40px auto;

            padding: 20px;
        }

        h1 {
            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        /* ================= CODE BOX ================= */

        .code-box {
            background: #1e1e1e;

            color: #f8f8f2;

            padding: 25px;

            border-radius: 10px;

            overflow-x: auto;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        pre {
            margin: 0;

            white-space: pre-wrap;

            font-family: Consolas, monospace;

            font-size: 14px;

            line-height: 1.6;
        }

        /* ================= MESSAGE ================= */

        #message {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            background: #222;

            color: white;

            padding: 12px 20px;

            border-radius: 6px;

            display: none;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            nav {
                flex-wrap: wrap;
            }

            nav button {
                padding: 10px 15px;

                font-size: 13px;
            }

            .container {
                margin: 20px auto;

                padding: 15px;
            }

            pre {
                font-size: 12px;
            }
        }
    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <button onclick="copyCode('bfs')">
            BFS
        </button>

        <button onclick="copyCode('dfs')">
            DFS
        </button>

        <button onclick="copyCode('bubble')">
            BUBBLE
        </button>

        <button onclick="copyCode('insert')">
            INSERT
        </button>

    </nav>


    <!-- ================= MAIN ================= -->

    <div class="container">

        <h1>
            Algorithm Codes
        </h1>

        <p class="subtitle">
            Click an algorithm to copy the C++ code
        </p>


        <div class="code-box">

            <pre id="code">Click an algorithm button above.</pre>

        </div>

    </div>


    <!-- ================= COPY MESSAGE ================= -->

    <div id="message">
        Code Copied!
    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const codes = {

            /* ================= BFS ================= */

            bfs: `#include <iostream>
#include <vector>
#include <queue>
using namespace std;

vector<int> graph[100];
bool visited[100];

void bfs(int start) {
    queue<int> q;

    q.push(start);
    visited[start] = true;

    while(!q.empty()) {
        int node = q.front();
        q.pop();

        cout << node << " ";

        for(int next : graph[node]) {
            if(!visited[next]) {
                visited[next] = true;
                q.push(next);
            }
        }
    }
}

int main() {
    int n, e;
    cin >> n >> e;

    for(int i = 0; i < e; i++) {
        int u, v;
        cin >> u >> v;

        graph[u].push_back(v);
        graph[v].push_back(u);
    }

    int start;
    cin >> start;

    bfs(start);

    return 0;
}`,


            /* ================= DFS ================= */

            dfs: `#include <iostream>
#include <vector>
using namespace std;

vector<int> graph[100];
bool visited[100];

void dfs(int node) {
    visited[node] = true;

    cout << node << " ";

    for(int next : graph[node]) {
        if(!visited[next]) {
            dfs(next);
        }
    }
}

int main() {
    int n, e;
    cin >> n >> e;

    for(int i = 0; i < e; i++) {
        int u, v;
        cin >> u >> v;

        graph[u].push_back(v);
        graph[v].push_back(u);
    }

    int start;
    cin >> start;

    dfs(start);

    return 0;
}`,


            /* ================= BUBBLE SORT ================= */

            bubble: `#include <iostream>
using namespace std;

int main() {

    int arr[] = {5, 3, 8, 4, 2};
    int n = 5;

    for(int i = 0; i < n - 1; i++) {

        for(int j = 0; j < n - i - 1; j++) {

            if(arr[j] > arr[j + 1]) {
                swap(arr[j], arr[j + 1]);
            }

        }
    }

    cout << "Sorted Array: ";

    for(int i = 0; i < n; i++)
        cout << arr[i] << " ";

    return 0;
}`,


            /* ================= INSERTION SORT ================= */

            insert: `#include <iostream>
using namespace std;

int main() {

    int arr[] = {5, 3, 8, 4, 2};
    int n = 5;

    for(int i = 1; i < n; i++) {

        int key = arr[i];

        int j = i - 1;

        while(j >= 0 && arr[j] > key) {

            arr[j + 1] = arr[j];

            j--;
        }

        arr[j + 1] = key;
    }

    cout << "Sorted Array: ";

    for(int i = 0; i < n; i++)
        cout << arr[i] << " ";

    return 0;
}`

        };


        /* ================= COPY FUNCTION ================= */

        function copyCode(algorithm) {

            const code = codes[algorithm];


            // Display selected code
            document.getElementById("code").textContent = code;


            // Modern clipboard method
            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                navigator.clipboard.writeText(code)

                    .then(function () {

                        showMessage("Code Copied!");

                    })

                    .catch(function () {

                        fallbackCopy(code);

                    });

            }

            else {

                fallbackCopy(code);

            }

        }


        /* ================= FALLBACK COPY ================= */

        function fallbackCopy(text) {

            const textarea = document.createElement("textarea");


            textarea.value = text;


            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";
            textarea.style.top = "0";


            document.body.appendChild(textarea);


            textarea.focus();
            textarea.select();


            try {

                document.execCommand("copy");

                showMessage("Code Copied!");

            }

            catch (error) {

                showMessage("Copy Failed");

            }


            document.body.removeChild(textarea);

        }


        /* ================= MESSAGE ================= */

        function showMessage(text) {

            const message = document.getElementById("message");


            message.textContent = text;


            message.style.display = "block";


            setTimeout(function () {

                message.style.display = "none";

            }, 1500);

        }

    </script>


</body>

</html>
